<!doctype html>
<html lang="zh-CN" data-request-token="__REQUEST_TOKEN__">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Session Bridge</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <main class="shell">
      <section class="hero" aria-labelledby="title">
        <div class="app-mark" aria-hidden="true">
          <span></span>
        </div>
        <h1 id="title">
          <span class="title-session">Session</span>
          <span class="title-bridge">Bridge</span>
        </h1>

        <ol class="session-guide" aria-label="使用步骤">
          <li class="guide-step">
            <span class="step-number">1</span>
            <p>
              登录
              <a
                href="https://chatgpt.com"
                target="_blank"
                rel="noreferrer"
              >https://chatgpt.com</a>
            </p>
          </li>
          <li class="guide-step">
            <span class="step-number">2</span>
            <p>
              登录后打开
              <a
                href="https://chatgpt.com/api/auth/session"
                target="_blank"
                rel="noreferrer"
              >https://chatgpt.com/api/auth/session</a>
            </p>
          </li>
          <li class="guide-step">
            <span class="step-number">3</span>
            <p>复制页面全部内容（不可缺漏）</p>
          </li>
        </ol>
      </section>

      <section class="card" aria-label="导入会话">
        <form id="session-form">
          <div class="field-heading">
            <label for="session-json">会话 JSON</label>
            <span id="character-count" aria-live="polite">0 字符</span>
          </div>
          <div class="textarea-wrap">
            <textarea
              id="session-json"
              name="sessionJson"
              required
              spellcheck="false"
              autocomplete="off"
              autocapitalize="off"
              placeholder='粘贴包含 "sessionToken" 的完整 JSON…'
            ></textarea>
            <button
              id="clear-button"
              class="clear-button"
              type="button"
              aria-label="清空输入"
              hidden
            >
              清空
            </button>
          </div>
          <button id="submit-button" class="primary-button" type="submit">
            <span class="button-label">验证并打开 Edge</span>
            <span class="spinner" aria-hidden="true"></span>
          </button>
        </form>

        <div id="status" class="status" role="status" aria-live="polite" hidden>
          <span class="status-icon" aria-hidden="true"></span>
          <span id="status-text"></span>
        </div>
      </section>

    </main>
  </body>
</html>
